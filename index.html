<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRMesa Digital</title>
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    color-scheme: light;
    --primary: #3e6a6d; --primary-dark: #022028; --primary-light: #5fded4;
    --success: #2f7d6a; --warning: #a8752a; --danger: #b3564e;
    --gray-50: #ebf0f0; --gray-100: #e2e8e8; --gray-200: #d3e0df;
    --gray-300: #afcecd; --gray-500: #6d9899; --gray-700: #3e6a6d; --gray-900: #022028;
    --surface: #ffffff; --border: rgba(2, 32, 40, 0.14);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --primary: #5fded4; --primary-dark: #1f4148; --primary-light: #84afaf;
    --success: #5fded4; --warning: #e0d3a8; --danger: #e8a09a;
    --gray-50: #022028; --gray-100: #0a181c; --gray-200: #1f4148;
    --gray-300: #3e6a6d; --gray-500: #6d9899; --gray-700: #84afaf; --gray-900: #ffffff;
    --surface: #0a181c; --border: #1f4148;
  }

  body { font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--gray-50); color: var(--gray-900); line-height: 1.5; padding: 20px; }
  .container { max-width: 1180px; margin: 0 auto; }

  .theme-btn { background: var(--gray-200); border: 1px solid var(--border); color: var(--gray-900); border-radius: 20px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .login-box { background: var(--surface); padding: 40px; border-radius: 12px; border: 1px solid var(--border); max-width: 400px; margin: 60px auto; text-align: center; }
  .login-toggle { display: flex; gap: 6px; background: var(--gray-200); padding: 4px; border-radius: 8px; margin-bottom: 16px; }
  .login-toggle button { flex: 1; padding: 8px; border: none; background: transparent; cursor: pointer; border-radius: 6px; }
  .login-toggle button.login-btn-ativo { background: var(--primary-dark); color: #fff; }

  select, input, textarea, button { width: 100%; padding: 10px 14px; margin-top: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; color: var(--gray-900); }
  button { background: var(--primary-dark); color: #fff; font-weight: 500; cursor: pointer; }
  button:hover { background: var(--primary); }

  .erro { margin-top: 16px; padding: 12px; background: rgba(179, 86, 78, 0.12); color: var(--danger); border-radius: 8px; font-size: 13px; }
  .topo { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: space-between; border-radius: 12px; margin-bottom: 20px; }
  .menu-suspenso { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; background: var(--surface); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); }
  
  .badge { display: inline-block; padding: 2px 9px; border-radius: 11px; font-size: 10.5px; font-weight: 500; }
  .b-novo { background: rgba(168, 117, 42, 0.13); color: var(--warning); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .tabela-wrapper { overflow-x: auto; }
  .tabela-base { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; }
  .tabela-base th, .tabela-base td { padding: 9px 11px; border-bottom: 1px solid var(--border); text-align: left; }
  
  .modal-fundo { position: fixed; inset: 0; background: rgba(2, 32, 40, 0.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal { background: var(--surface); border-radius: 12px; padding: 24px; max-width: 500px; width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <!-- TELA DE LOGIN -->
    <div id="login" class="login-box">
      <h1>🔐 CRMesa Digital</h1>
      <p>Faça login para acessar o sistema</p>
      <div class="login-toggle">
        <button id="btnModoAssessor" class="login-btn-ativo" onclick="setModoLogin('assessor')">Assessor</button>
        <button id="btnModoAdmin" onclick="setModoLogin('admin')">Administrador</button>
      </div>
      <input type="text" id="txtUsuario" placeholder="Digite seu login" autocomplete="off">
      <input type="password" id="senha" placeholder="Senha">
      <button id="btnEntrar" onclick="fazerLogin()">Entrar</button>
      <div id="erro" class="erro" style="display:none;">Usuário ou senha inválidos.</div>
    </div>

    <!-- DASHBOARD ASSESSOR -->
    <div id="dashboard" style="display:none;">
      <div class="topo">
        <h1>👋 Olá, <span id="nomeLogado"></span></h1>
        <div class="acoes">
          <button type="button" class="theme-btn" id="tbtnAssessor" onclick="alternarTema()">Tema: claro</button>
          <button class="btn-sair" onclick="sair()" style="width: auto;">Sair</button>
        </div>
      </div>

      <div class="menu-suspenso">
        <label for="menuAbas">📂 Navegar:</label>
        <select id="menuAbas" onchange="trocarAbaAssessor(this.value)">
          <option value="indicacoes">📋 Indicações Consultoria</option>
        </select>
      </div>

      <div id="conteudoIndicacoes">
        <div id="lista"></div>
      </div>
    </div>

    <!-- PAINEL ADMIN -->
    <div id="adminPanel" style="display:none;">
      <div class="topo">
        <h1>📊 Painel Administrativo</h1>
        <div class="acoes">
          <span id="adminNome"></span>
          <button class="btn-sair" onclick="sair()" style="width: auto;">Sair</button>
        </div>
      </div>
      <div id="conteudoAdmin">
        <div class="tabela-wrapper"><div id="tabelaLeadsAdmin"></div></div>
      </div>
    </div>
  </div>

  <!-- MODAL DE EDIÇÃO DO LEAD -->
  <div class="modal-fundo" id="modalFundo">
    <div class="modal">
      <h2 id="modalTitulo">Atualizar Atendimento</h2>
      <label>Status</label>
      <select id="modalStatus">
        <option value="Novo">Novo</option>
        <option value="Em contato">Em contato</option>
        <option value="Em negociação">Em negociação</option>
        <option value="Convertido">Convertido</option>
        <option value="Não interessado">Não interessado</option>
      </select>
      <label>Observações</label>
      <textarea id="modalObs" rows="4"></textarea>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button onclick="fecharModal()" style="background:var(--gray-200); color:var(--gray-900)">Cancelar</button>
        <button onclick="salvarLead()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
  // ═══════════════════════════════════════════════════════════
  // ENDPOINT DA API DO GOOGLE APPS SCRIPT
  // ═══════════════════════════════════════════════════════════
  const API_URL = 'https://script.google.com/macros/s/AKfycbySwUmEYcsGE1b9Tom_2UpSZOYX6WRQ2f5z3snEm7t1IM2vi1SibS611wY71RCHlz5few/exec';

  async function chamarAPI(action, params = {}) {
    try {
      if (!API_URL || API_URL.includes('COLE_AQUI')) {
        alert('Erro: A URL da API precisa ser configurada.');
        return { ok: false, msg: 'API_URL inválida.' };
      }

      const url = new URL(API_URL);
      url.searchParams.append('action', action);
      Object.keys(params).forEach(k => {
        if (params[k] !== undefined && params[k] !== null) {
          url.searchParams.append(k, params[k]);
        }
      });

      const res = await fetch(url.toString(), { method: 'GET', redirect: 'follow' });
      return await res.json();
    } catch (err) {
      console.error(`Erro na requisição [${action}]:`, err);
      return { ok: false, msg: err.message };
    }
  }

  let modoLogin = 'assessor';
  let vendedorLogado = '';
  let adminLogado = '';
  let linhaEditando = null;
  let leadsCache = [];

  function setModoLogin(modo) {
    modoLogin = modo;
    document.getElementById('btnModoAssessor').className = modo === 'assessor' ? 'login-btn-ativo' : '';
    document.getElementById('btnModoAdmin').className = modo === 'admin' ? 'login-btn-ativo' : '';
  }

  async function fazerLogin() {
    const usuario = document.getElementById('txtUsuario').value.trim();
    const senha = document.getElementById('senha').value;
    const erroDiv = document.getElementById('erro');
    const btn = document.getElementById('btnEntrar');

    if (!usuario || !senha) {
      erroDiv.textContent = 'Preencha login e senha.';
      erroDiv.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const action = modoLogin === 'admin' ? 'loginAdmin' : 'login';
    const res = await chamarAPI(action, { usuario, senha });

    btn.disabled = false;
    btn.textContent = 'Entrar';

    if (res && res.ok) {
      erroDiv.style.display = 'none';
      if (modoLogin === 'admin') abrirAdmin(res.nome);
      else abrirAssessor(res.nome);
    } else {
      erroDiv.textContent = res.msg || 'Usuário ou senha inválidos.';
      erroDiv.style.display = 'block';
    }
  }

  function abrirAssessor(nome) {
    vendedorLogado = nome;
    document.getElementById('nomeLogado').textContent = nome;
    document.getElementById('login').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    carregarLeads();
  }

  function abrirAdmin(nome) {
    adminLogado = nome;
    document.getElementById('adminNome').textContent = 'Admin: ' + nome;
    document.getElementById('login').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    carregarLeadsAdmin();
  }

  function sair() {
    vendedorLogado = '';
    adminLogado = '';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('login').style.display = 'block';
  }

  async function carregarLeads() {
    const lista = document.getElementById('lista');
    lista.innerHTML = '<div style="padding:20px;text-align:center;">Carregando indicações...</div>';
    
    const dados = await chamarAPI('getLeads', { assessor: vendedorLogado });
    if (!Array.isArray(dados) || dados.length === 0) {
      lista.innerHTML = '<div style="padding:20px;text-align:center;">Nenhum lead atribuído.</div>';
      return;
    }

    leadsCache = dados;
    let html = '';
    dados.forEach(l => {
      html += `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>${l.nomeLead}</h3>
            <span class="badge b-novo">${l.status}</span>
          </div>
          <p style="margin-top:6px; font-size:13px; color:var(--gray-700)">
            📞 ${l.celularLead} | ✉️ ${l.emailLead}<br>
            💰 Aporte: ${l.aporte || '-'} | 💼 Consultor: ${l.nomeConsultor || '-'}
          </p>
          <div style="margin-top:10px; text-align:right;">
            <button onclick="abrirModal(${l.row})" style="width:auto; padding:6px 12px; font-size:12px;">Atualizar</button>
          </div>
        </div>
      `;
    });
    lista.innerHTML = html;
  }

  async function carregarLeadsAdmin() {
    const container = document.getElementById('tabelaLeadsAdmin');
    container.innerHTML = '<div style="padding:20px;text-align:center;">Carregando painel admin...</div>';
    
    const dados = await chamarAPI('getTodosLeads', { adminLogado });
    if (!Array.isArray(dados) || dados.length === 0) {
      container.innerHTML = '<div style="padding:20px;text-align:center;">Nenhum lead cadastrado.</div>';
      return;
    }

    let html = '<table class="tabela-base"><thead><tr><th>Lead</th><th>Assessor</th><th>Status</th><th>Consultor</th></tr></thead><tbody>';
    dados.forEach(l => {
      html += `<tr><td><b>${l.nomeLead}</b></td><td>${l.assessor}</td><td>${l.status}</td><td>${l.nomeConsultor || '-'}</td></tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function abrirModal(row) {
    const lead = leadsCache.find(x => x.row === row);
    if (!lead) return;
    linhaEditando = row;
    document.getElementById('modalTitulo').textContent = 'Atualizar: ' + lead.nomeLead;
    document.getElementById('modalStatus').value = lead.status || 'Novo';
    document.getElementById('modalObs').value = lead.observacoes || '';
    document.getElementById('modalFundo').style.display = 'flex';
  }

  function fecharModal() {
    document.getElementById('modalFundo').style.display = 'none';
    linhaEditando = null;
  }

  async function salvarLead() {
    const status = document.getElementById('modalStatus').value;
    const obs = document.getElementById('modalObs').value;
    const lead = leadsCache.find(x => x.row === linhaEditando);

    const res = await chamarAPI('updateLead', {
      row: linhaEditando,
      status: status,
      obs: obs,
      vendedor: vendedorLogado,
      statusAntigo: lead ? lead.status : '',
      cliente: lead ? lead.nomeLead : ''
    });

    if (res && res.ok) {
      fecharModal();
      carregarLeads();
    } else {
      alert('Erro ao atualizar: ' + (res.msg || 'Falha na requisição'));
    }
  }

  function alternarTema() {
    const html = document.documentElement;
    const tema = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', tema);
  }
  </script>
</body>
</html>
